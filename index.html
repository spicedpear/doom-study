<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#08080a"><title>DoomStudy v0.3.1</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#08080a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial}body{overflow:hidden}#f{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}.c{height:100dvh;scroll-snap-align:start;padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;background:radial-gradient(circle at 82% 3%,#2d1748,#111116 35%,#08080a 73%)}.top,.bot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#999;max-width:720px;width:100%;margin:auto}.brand{font-weight:950;color:white;letter-spacing:.08em}.stats{display:flex;gap:7px}.pill{border:1px solid #35353e;border-radius:999px;padding:6px 9px;background:#121216}.main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:720px;width:100%;margin:auto}.k{font-size:12px;font-weight:950;letter-spacing:.15em;color:#c7aaff;margin-bottom:12px}.q{font-size:clamp(24px,6.2vw,39px);font-weight:880;line-height:1.08;margin-bottom:24px}.opts{display:grid;gap:10px}.o{border:1px solid #36363f;background:#17171c;color:white;border-radius:18px;padding:17px 16px;text-align:left;font-size:17px;font-weight:680;min-height:58px}.o.ok{background:#34343e;border-color:white}.o.no{opacity:.38;text-decoration:line-through}.fb{display:none;margin-top:16px;padding:15px;border:1px solid #303038;border-radius:17px;background:#17171c;line-height:1.38}.fb.show{display:block}.res{font-weight:950;margin-bottom:5px}.src{font-size:12px;color:#888;margin-top:8px}.special{justify-content:center;text-align:center;background:radial-gradient(circle at 50% 35%,#321a50,#0d0d12 55%,#08080a)}.special h1{font-size:clamp(35px,10vw,62px);margin:10px 0}.special p{color:#bbb;font-size:18px;max-width:520px;margin:auto;line-height:1.4}.emoji{font-size:54px}.toast{position:fixed;z-index:9;left:50%;top:10%;transform:translateX(-50%);background:white;color:#111;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:950;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1}
.sound{border:1px solid #35353e;background:#121216;color:#fff;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:850}
.conf{display:flex;gap:8px;margin:0 0 13px;flex-wrap:wrap}.conf button{border:1px solid #303038;background:#101014;color:#aaa;border-radius:999px;padding:8px 11px;font-weight:750}.conf button.sel{border-color:#c7aaff;color:#fff;background:#241936}
.teach{justify-content:center;background:radial-gradient(circle at 50% 32%,#18334a,#0d0d12 58%,#08080a)}.teach .tag{font-size:12px;font-weight:950;letter-spacing:.15em;color:#8bd3ff}.teach .fact{font-size:clamp(29px,8vw,50px);font-weight:900;line-height:1.02;margin:15px 0}.teach .chain{font-size:19px;line-height:1.65;color:#d5d5dc}.teach .hint{color:#8f8f98;margin-top:22px;font-size:13px}

</style></head><body><div id="toast" class="toast"></div><main id="f"></main><script>
const C=[{"id": "mu", "t": "Receptors", "v": [["FLASH", "μ receptor effects use which mnemonic?", ["REAP", "SAM", "FAST", "MUDPILES"], 0, "μ = REAP: respiratory depression, euphoria, analgesia, physical dependence.", "12"], ["QUICK HIT", "Which effect points toward μ rather than κ?", ["Euphoria", "Miosis", "Analgesia", "Sedation"], 0, "Euphoria belongs to μ's REAP; κ = SAM.", "12"]]}, {"id": "kappa", "t": "Receptors", "v": [["FLASH", "Complete κ = SAM: Sedation, Analgesia, ____.", ["Miosis", "Mydriasis", "Mania", "Memory loss"], 0, "κ = SAM: sedation, analgesia, miosis.", "12"], ["SPOT THE LIE", "Which is NOT part of κ = SAM?", ["Euphoria", "Sedation", "Analgesia", "Miosis"], 0, "Euphoria is listed with μ.", "12"]]}, {"id": "gi", "t": "MOA", "v": [["MECHANISM", "Opioid receptor activation produces which intracellular change?", ["Gi → ↓ cAMP", "Gs → ↑ cAMP", "Gq → ↑ IP₃/DAG", "Direct Na⁺ channel opening"], 0, "Inhibitory G-protein signaling decreases cAMP and promotes neuronal hyperpolarization.", "16"], ["QUICK HIT", "μ receptor signaling: cAMP goes…", ["Down", "Up", "Unchanged", "Up then down"], 0, "μ signaling decreases cAMP.", "16"]]}, {"id": "morphine", "t": "Morphine", "v": [["CLINICAL DROP", "Severe pain plus intracranial injury: which lecture drug is specifically contraindicated?", ["Morphine", "Naloxone", "Naltrexone", "Loperamide"], 0, "The lecture lists intracranial injury/increased ICP among morphine contraindications.", "17"], ["TRAP", "Which appears in the lecture's morphine contraindications?", ["Paralytic ileus", "Hyperthyroidism", "Iron deficiency", "Nephrolithiasis"], 0, "Paralytic ileus is listed.", "17"]]}, {"id": "meperidine", "t": "Meperidine", "v": [["TRAP", "Repeated meperidine in renal dysfunction is followed by seizures. Which metabolite accumulated?", ["Normeperidine", "Morphine-6-glucuronide", "Norcodeine", "Naltrexone"], 0, "Normeperidine accumulation can cause seizures; avoid meperidine in renal dysfunction.", "22"], ["PREDICTION", "Normeperidine inhibits serotonin reuptake. What complication is associated?", ["Serotonin syndrome", "NMS", "Malignant hyperthermia", "Cholinergic crisis"], 0, "The lecture links normeperidine with serotonin syndrome.", "22"]]}, {"id": "heroin", "t": "Heroin", "v": [["FLASH", "Why does heroin enter the brain especially readily?", ["High lipophilicity", "High protein binding", "Renal activation", "Selective κ binding"], 0, "The lecture describes heroin as highly lipophilic.", "24"]]}, {"id": "diarrhea", "t": "Antidiarrheals", "v": [["CLINICAL DROP", "Which antidiarrheal is described as having GI effects only?", ["Loperamide", "Diphenoxylate", "Codeine", "Dextromethorphan"], 0, "Loperamide is GI-only; diphenoxylate has GI and CNS effects.", "31"], ["COMPARE", "Which has both GI and CNS effects?", ["Diphenoxylate", "Loperamide", "Naloxone", "Naltrexone"], 0, "Diphenoxylate has GI and CNS effects.", "31"]]}, {"id": "naloxone", "t": "Naloxone", "v": [["BOSS", "An overdose patient wakes after naloxone, then becomes sedated again later. Best explanation?", ["Naloxone lasts ~1–2 h, shorter than many agonists", "Naloxone irreversibly blocks μ", "Naloxone becomes morphine", "Naloxone has delayed CNS entry"], 0, "Naloxone lasts only 1–2 hours, so repeat doses may be needed.", "34"], ["FLASH", "Naloxone has approximately how much greater affinity for μ?", ["10-fold", "2-fold", "50-fold", "100-fold"], 0, "The lecture states 10-fold affinity for μ.", "34"], ["REMATCH", "Why might naloxone need repeat dosing?", ["The agonist may outlast naloxone", "Naloxone takes hours to work", "It only binds κ", "It causes receptor synthesis"], 0, "Many agonists outlast naloxone's 1–2 hour duration.", "34"]]}, {"id": "naltrexone", "t": "Naltrexone", "v": [["COMPARE", "Which oral long-acting antagonist can block injected heroin effects up to 48 h after 100 mg?", ["Naltrexone", "Naloxone", "Buprenorphine", "Pentazocine"], 0, "Those features are listed for naltrexone.", "35"], ["TRAP", "Which major toxicity is emphasized for naltrexone?", ["Hepatotoxicity", "Nephrotoxicity", "Ototoxicity", "Pulmonary fibrosis"], 0, "The lecture emphasizes hepatotoxicity.", "35"]]}, {"id": "bup", "t": "Mixed acting", "v": [["FLASH", "Which partial agonist is used for outpatient opioid detoxification?", ["Buprenorphine", "Butorphanol", "Naloxone", "Methadone"], 0, "Buprenorphine is identified as a partial agonist used for outpatient detoxification.", "32"]]}, {"id": "tn", "t": "Neuropathic pain", "v": [["CLINICAL DROP", "Which treatment is paired with trigeminal neuralgia?", ["Carbamazepine", "Pregabalin + duloxetine", "Gabapentin + pregabalin", "Trazodone"], 0, "The lecture pairs trigeminal neuralgia with carbamazepine.", "47"]]}],K="doomstudy-v02";let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||{xp:0,streak:0,best:0,total:0,correct:0,seen:{},miss:{},mastery:{},seq:0,sound:true};if(S.sound===undefined)S.sound=true;const F=document.getElementById("f");let last="",n=0;
const strength=()=>{let a=Object.values(S.mastery);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0};function save(){localStorage.setItem(K,JSON.stringify(S))}function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),850)}
let AC=null;
async function tone(ok){
 if(!S.sound)return;
 try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended") await AC.resume();
  let now=AC.currentTime+.01;
  function ping(freq,start,dur,gain,type="sine"){
   let o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,now+start);
   g.gain.setValueAtTime(0.0001,now+start);g.gain.exponentialRampToValueAtTime(gain,now+start+.018);g.gain.exponentialRampToValueAtTime(0.0001,now+start+dur);
   o.connect(g);g.connect(AC.destination);o.start(now+start);o.stop(now+start+dur+.03);
  }
  if(ok){ping(587,0,.16,.18);ping(880,.11,.23,.15)}
  else{ping(294,0,.20,.16,"triangle");ping(220,.13,.27,.13,"triangle")}
 }catch(e){}
}
function toggleSound(ev){ev.stopPropagation();S.sound=!S.sound;save();document.querySelectorAll(".sound").forEach(b=>b.textContent=S.sound?"🔊":"🔇");if(S.sound)tone(true)}
function pick(){let p=C.filter(x=>x.id!==last).map(c=>({c,w:1+(S.miss[c.id]||0)*3+(!(S.seen[c.id])?3:0)+(100-(S.mastery[c.id]||0))/50})),sum=p.reduce((a,x)=>a+x.w,0),r=Math.random()*sum;for(let x of p){r-=x.w;if(r<=0){last=x.c.id;return x.c}}return p[0].c}
function special(){
 if(S.seq%17===0)return["👹","BOSS INCOMING","Next stretch gets harder. Transfer > recognition."];
 if(S.seq%11===0)return["🧠","BRAIN REPORT",`${strength()}% concept strength • ${S.xp} XP • best streak ${S.best}`];
 if(S.streak>=5&&S.seq%8===0)return["🔥","YOU'RE COOKING",`${S.streak} correct in a row. Weak concepts are being pulled forward.`];
 return null
}
function teaching(){
 if(S.seq%7!==0)return null;
 let weak=C.slice().sort((a,b)=>(S.mastery[a.id]||0)-(S.mastery[b.id]||0))[0];
 let map={
  naloxone:["MICRO-TEACH","Naloxone can wear off first.","Naloxone → rapid reversal<br>Duration ≈ 1–2 h<br>Agonist may persist → respiratory depression can recur"],
  meperidine:["MICRO-TEACH","Renal failure changes the danger.","Meperidine → normeperidine<br>↓ renal clearance → accumulation<br>Neurotoxicity → seizures"],
  gi:["MICRO-TEACH","Follow the signal.","Opioid receptor → Gi<br>↓ cAMP<br>neuronal inhibition"],
  diarrhea:["MICRO-TEACH","Same family, different reach.","Loperamide → GI effects only<br>Diphenoxylate → GI + CNS effects"]
 };
 return map[weak.id]||null
}
function add(){S.seq++;let teach=teaching(),sp=special(),e=document.createElement("section");if(teach){e.className="c teach";e.innerHTML=`<div class="main"><div class="tag">${teach[0]}</div><div class="fact">${teach[1]}</div><div class="chain">${teach[2]}</div><div class="hint">No answer required • keep scrolling ↑</div></div>`;F.appendChild(e);return}if(sp){e.className="c special";e.innerHTML=`<div class="main"><div class="emoji">${sp[0]}</div><h1>${sp[1]}</h1><p>${sp[2]}</p><h3>SWIPE ↑</h3></div>`;F.appendChild(e);return}
let c=pick(),seen=S.seen[c.id]||0,v=c.v[seen%c.v.length],item={id:c.id,t:c.t,type:v[0],q:v[1],ch:v[2],a:v[3],why:v[4],slide:v[5]};e.className="c flash";e.innerHTML=`<div class="top"><b class="brand">DOOMSTUDY</b><div class="stats"><span class="pill streak">🔥 ${S.streak}</span><span class="pill xp">⚡ ${S.xp}</span><button class="sound" onclick="toggleSound(event)">🔊</button></div></div><div class="main"><div class="k">${item.type} · ${item.t}</div><div class="q">${item.q}</div><div class="opts"></div><div class="fb"><div class="res"></div><div>${item.why}</div><div class="src">Lecture slide ${item.slide} • adaptive feed</div></div></div><div class="bot"><span class="str">🧠 ${strength()}% strength</span><b>SWIPE ↑</b></div>`;let box=e.querySelector(".opts");item.ch.forEach((x,j)=>{let b=document.createElement("button");b.className="o";b.textContent=x;b.onclick=()=>ans(item,j,e);box.appendChild(b)});F.appendChild(e);e.querySelectorAll(".sound").forEach(b=>b.textContent=S.sound?"🔊":"🔇")}
function ans(i,j,e){if(e.dataset.done)return;e.dataset.done=1;let ok=j===i.a,old=S.mastery[i.id]||0;tone(ok);S.total++;S.seen[i.id]=(S.seen[i.id]||0)+1;if(ok){S.correct++;S.streak++;S.best=Math.max(S.best,S.streak);let b=i.type==="BOSS"?35:15+Math.min(S.streak,10);S.xp+=b;S.mastery[i.id]=Math.min(100,old+12);toast(`+${b} XP • STREAK ×${S.streak}`)}else{S.streak=0;S.miss[i.id]=(S.miss[i.id]||0)+1;S.mastery[i.id]=Math.max(0,old-8);toast("REMATCH WEIGHT ↑")}e.querySelectorAll(".o").forEach((b,k)=>{b.disabled=true;if(k===i.a)b.classList.add("ok");else if(k===j)b.classList.add("no")});e.querySelector(".res").textContent=ok?"✓ LOCKED IN":"✕ NOT QUITE • REMATCH QUEUED";e.querySelector(".fb").classList.add("show");save();document.querySelectorAll(".streak").forEach(x=>x.textContent="🔥 "+S.streak);document.querySelectorAll(".xp").forEach(x=>x.textContent="⚡ "+S.xp);document.querySelectorAll(".str").forEach(x=>x.textContent="🧠 "+strength()+"% strength")}
for(let i=0;i<12;i++)add();F.addEventListener("scroll",()=>{if(F.scrollHeight-F.scrollTop-F.clientHeight<F.clientHeight*3)for(let i=0;i<8;i++)add()},{passive:true});
</script></body></html>
