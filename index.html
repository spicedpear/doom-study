<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#09090b"><title>DoomStudy</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#09090b;color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}body{overflow:hidden}#feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}.card{height:100dvh;scroll-snap-align:start;padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;background:radial-gradient(circle at 85% 5%,#2b1744,#101014 35%,#09090b 72%)}.top,.bottom{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#999;max-width:700px;width:100%;margin:auto}.brand{font-weight:900;color:white;letter-spacing:.06em}.pill{border:1px solid #38383f;border-radius:999px;padding:6px 9px}.progress{height:4px;background:#27272a;border-radius:9px;margin:14px 0}.bar{height:100%;background:white;border-radius:9px}.main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:700px;width:100%;margin:auto}.kicker{font-size:12px;font-weight:900;letter-spacing:.14em;color:#c4a9ff;margin-bottom:12px}.q{font-size:clamp(24px,6vw,38px);font-weight:850;line-height:1.08;margin-bottom:24px}.choices{display:grid;gap:10px}.choice{appearance:none;border:1px solid #37373f;background:#17171b;color:white;border-radius:17px;padding:17px 16px;text-align:left;font-size:17px;font-weight:650;min-height:58px}.choice.correct{background:#34343c;border-color:white}.choice.wrong{opacity:.4;text-decoration:line-through}.feedback{display:none;margin-top:16px;padding:15px;border:1px solid #303038;border-radius:16px;background:#17171b;line-height:1.4}.feedback.show{display:block}.result{font-weight:900;margin-bottom:5px}.source{font-size:12px;color:#8e8e93;margin-top:8px}.bottom{padding-top:10px}.swipe{font-weight:800}.toast{position:fixed;z-index:9;left:50%;top:10%;transform:translateX(-50%);background:white;color:#111;padding:9px 13px;border-radius:999px;font-size:12px;font-weight:900;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}</style></head>
<body><div id="toast" class="toast"></div><main id="feed"></main><script>
const cards=[{"type": "FLASH", "topic": "Receptors", "q": "Which opioid receptor is associated with respiratory depression, euphoria, analgesia, and physical dependence?", "choices": ["μ (mu)", "δ (delta)", "κ (kappa)", "σ (sigma)"], "a": 0, "why": "μ = REAP: Respiratory depression, Euphoria, Analgesia, Physical dependence.", "slide": "12"}, {"type": "SPOT THE LIE", "topic": "Receptors", "q": "Which effect does NOT belong to the lecture’s κ-receptor mnemonic “SAM”?", "choices": ["Euphoria", "Analgesia", "Sedation", "Miosis"], "a": 0, "why": "κ = SAM: Sedation, Analgesia, Miosis. Euphoria is listed with μ.", "slide": "12"}, {"type": "MECHANISM", "topic": "MOA", "q": "Opioid receptor activation produces which intracellular change?", "choices": ["Gs → ↑ cAMP", "Gq → ↑ IP₃/DAG", "Direct Na⁺ channel opening", "Gi → ↓ cAMP"], "a": 3, "why": "The lecture describes inhibitory G-protein signaling → decreased cAMP → neuronal hyperpolarization → diminished pain perception.", "slide": "16"}, {"type": "CLINICAL DROP", "topic": "Morphine", "q": "A patient with severe pain also has an intracranial injury. Which lecture drug is specifically contraindicated?", "choices": ["Morphine", "Naloxone", "Naltrexone", "Loperamide"], "a": 0, "why": "Morphine contraindications listed include respiratory compromise, asthma, intracranial injuries/increased ICP, and paralytic ileus.", "slide": "17"}, {"type": "TRAP", "topic": "Meperidine", "q": "A patient with renal dysfunction receives repeated meperidine and develops seizures. Which metabolite accumulated?", "choices": ["Normeperidine", "Morphine-6-glucuronide", "Norcodeine", "Naltrexone"], "a": 0, "why": "Meperidine is metabolized to normeperidine; accumulation can cause seizures, so the lecture says to avoid it in renal dysfunction.", "slide": "22"}, {"type": "PREDICTION", "topic": "Meperidine", "q": "Normeperidine inhibits serotonin reuptake. What complication does the lecture associate with this?", "choices": ["Neuroleptic malignant syndrome", "Malignant hyperthermia", "Serotonin syndrome", "Cholinergic crisis"], "a": 2, "why": "The lecture links normeperidine’s serotonin reuptake inhibition with serotonin syndrome.", "slide": "22"}, {"type": "FLASH", "topic": "Heroin", "q": "Why does heroin enter the brain especially readily?", "choices": ["It selectively binds κ receptors", "It is renally activated", "It is highly lipophilic", "It is highly protein-bound"], "a": 2, "why": "Heroin is described as highly lipophilic, enhancing entry into the brain.", "slide": "24"}, {"type": "CLINICAL DROP", "topic": "Antidiarrheals", "q": "Which antidiarrheal is described as having GI effects only?", "choices": ["Codeine", "Loperamide", "Dextromethorphan", "Diphenoxylate"], "a": 1, "why": "The lecture contrasts loperamide (GI effects only) with diphenoxylate (GI and CNS effects).", "slide": "31"}, {"type": "BOSS", "topic": "Naloxone", "q": "An opioid-overdose patient wakes rapidly after naloxone, then becomes sedated again later. Best explanation?", "choices": ["Naloxone has delayed CNS penetration", "Naloxone is converted to morphine", "Naloxone irreversibly blocks μ receptors", "Naloxone lasts only ~1–2 h, shorter than many opioid agonists"], "a": 3, "why": "Naloxone reverses respiratory depression/sedation rapidly but lasts only 1–2 hours, so repeat doses may be needed.", "slide": "34"}, {"type": "FLASH", "topic": "Naloxone", "q": "Naloxone binds μ, κ, and δ receptors, but has approximately how much greater affinity for μ?", "choices": ["100-fold", "2-fold", "50-fold", "10-fold"], "a": 3, "why": "The lecture states naloxone has 10-fold affinity to the μ receptor.", "slide": "34"}, {"type": "COMPARE", "topic": "Antagonists", "q": "Which antagonist is oral, long acting, and can block injected heroin effects for up to 48 hours after a 100 mg dose?", "choices": ["Naltrexone", "Pentazocine", "Buprenorphine", "Naloxone"], "a": 0, "why": "Those pharmacokinetic features are listed for naltrexone.", "slide": "35"}, {"type": "TRAP", "topic": "Naltrexone", "q": "Which major toxicity is specifically emphasized for naltrexone?", "choices": ["Pulmonary fibrosis", "Nephrotoxicity", "Hepatotoxicity", "Ototoxicity"], "a": 2, "why": "The lecture describes naltrexone as highly hepatotoxic.", "slide": "35"}, {"type": "FLASH", "topic": "Mixed acting", "q": "Which drug is identified as a partial agonist used for outpatient opioid detoxification?", "choices": ["Butorphanol", "Buprenorphine", "Methadone", "Naloxone"], "a": 1, "why": "The lecture labels buprenorphine as a partial agonist used for outpatient opioid detoxification.", "slide": "32"}, {"type": "CLINICAL DROP", "topic": "Neuropathic pain", "q": "Which treatment is paired with trigeminal neuralgia in the lecture?", "choices": ["Trazodone", "Pregabalin + duloxetine", "Carbamazepine", "Gabapentin + pregabalin"], "a": 2, "why": "The neuropathic-pain slide pairs trigeminal neuralgia with carbamazepine.", "slide": "47"}],key="doomstudy-opioids-v02";let s;try{s=JSON.parse(localStorage.getItem(key))||{answered:{},correct:0,total:0,missed:[]}}catch(e){s={answered:{},correct:0,total:0,missed:[]}}
const feed=document.getElementById("feed");const mastery=()=>s.total?Math.round(s.correct/s.total*100):0;function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}
function pop(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),800)}
function paint(i,el){let c=cards[i],v=s.answered[i];el.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(j===c.a)b.classList.add("correct");else if(j===v)b.classList.add("wrong")})}
function answer(i,j,el){if(s.answered[i]!==undefined)return;let ok=j===cards[i].a;s.answered[i]=j;s.total++;if(ok)s.correct++;else s.missed.push(i);save();paint(i,el);el.querySelector(".result").textContent=ok?"✓ LOCKED IN":"✕ NOT QUITE";el.querySelector(".feedback").classList.add("show");document.querySelectorAll(".mastery").forEach(x=>x.textContent="🧠 "+mastery()+"%");pop(ok?"+ XP • SWIPE ↑":"REMATCH QUEUED")}
cards.forEach((c,i)=>{let el=document.createElement("section");el.className="card";el.innerHTML=`<div class="top"><b class="brand">DOOMSTUDY</b><span class="pill">${c.topic}</span></div><div class="progress"><div class="bar" style="width:${(i+1)/cards.length*100}%"></div></div><div class="main"><div class="kicker">${c.type}</div><div class="q">${c.q}</div><div class="choices"></div><div class="feedback"><div class="result"></div><div>${c.why}</div><div class="source">Lecture slide ${c.slide} • lecture-only prototype</div></div></div><div class="bottom"><span class="mastery">🧠 ${mastery()}%</span><span class="swipe">SWIPE ↑</span></div>`;let box=el.querySelector(".choices");c.choices.forEach((ch,j)=>{let b=document.createElement("button");b.className="choice";b.textContent=ch;b.onclick=()=>answer(i,j,el);box.appendChild(b)});feed.appendChild(el);if(s.answered[i]!==undefined){paint(i,el);el.querySelector(".result").textContent=s.answered[i]===c.a?"✓ LOCKED IN":"✕ NOT QUITE";el.querySelector(".feedback").classList.add("show")}})
</script></body></html>
