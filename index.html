<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DoomStudy — Human Development v3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050309;color:#f8f5ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;height:100%;overflow:hidden}
#feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
.card{height:100dvh;scroll-snap-align:start;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);display:flex;flex-direction:column;justify-content:center;position:relative;background:radial-gradient(circle at 50% 14%,#21102f 0%,#100817 30%,#050309 68%)}
.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;z-index:3}.brand{font-weight:950;letter-spacing:-.04em}.stats{display:flex;gap:7px;align-items:center}.pill,.sound{background:rgba(24,12,34,.82);border:1px solid #43265a;border-radius:999px;padding:7px 10px;color:#fff;font-weight:800;font-size:12px}.sound{cursor:pointer}
.kicker{font-size:12px;font-weight:950;letter-spacing:.14em;color:#c4a4e8;text-transform:uppercase}.q{font-size:clamp(28px,7.5vw,43px);line-height:1.05;font-weight:900;letter-spacing:-.04em;margin:13px 0 22px}
.opts{display:grid;gap:10px}.opt{width:100%;text-align:left;padding:16px 17px;border-radius:18px;border:1px solid #3a2548;background:linear-gradient(180deg,#140c1c,#0c0811);color:#fff;font-size:17px;font-weight:760;transition:.15s}.opt:active{transform:scale(.985)}.opt.good{background:#123322;border-color:#3fa36c}.opt.bad{background:#391719;border-color:#b84b51}.opt.dim{opacity:.48}
.feedback{min-height:92px;margin-top:17px;font-size:15px;line-height:1.45;color:#c9c9d1}.feedback b{color:#fff}.source{position:absolute;bottom:max(17px,env(safe-area-inset-bottom));font-size:11px;color:#666}
.teach{background:radial-gradient(circle at 50% 24%,#3b1558 0%,#180b25 34%,#050309 72%)}.teach .kicker{color:#d5a8ff}.fact{font-size:clamp(30px,8vw,50px);line-height:1.02;font-weight:950;letter-spacing:-.04em;margin:14px 0}.chain{font-size:20px;line-height:1.55;color:#ddd}.scroll{margin-top:25px;color:#777;font-size:13px}
.event{text-align:center;background:radial-gradient(circle at 50% 38%,#35134e,#050309 65%)}.event .emoji{font-size:58px}.event h2{font-size:38px;margin:12px 0 8px}.event p{color:#aaa;line-height:1.5}
.heart{position:absolute;right:22px;bottom:max(58px,calc(env(safe-area-inset-bottom) + 42px));width:48px;height:48px;border-radius:50%;border:1px solid #5b3476;background:rgba(14,7,20,.72);color:#e9d6ff;font-size:25px;display:grid;place-items:center;z-index:4;-webkit-tap-highlight-color:transparent;transition:transform .14s ease,background .14s ease,color .14s ease}.heart:active{transform:scale(.88)}.heart.saved{background:#6e2d9b;color:#fff;border-color:#b56ee7}.heart.pop{animation:heartpop .32s ease}@keyframes heartpop{0%{transform:scale(.8)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
.notebookBtn{background:rgba(24,12,34,.82);border:1px solid #43265a;border-radius:999px;padding:7px 10px;color:#fff;font-weight:850;font-size:12px;cursor:pointer;display:flex;gap:5px;align-items:center}.notebookBtn .count{color:#d8b4ff}
#notebook{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#08040d 0%,#050309 100%);display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 40px)}#notebook.open{display:block}.nbHead{position:sticky;top:0;z-index:2;margin:-18px -18px 18px;padding:18px;background:rgba(8,4,13,.94);backdrop-filter:blur(18px);border-bottom:1px solid #281533}.nbTop{display:flex;align-items:center;justify-content:space-between}.nbTitle{font-size:29px;font-weight:950;letter-spacing:-.04em}.nbSub{color:#9d8aa9;font-size:13px;margin-top:5px}.closeNb{width:42px;height:42px;border-radius:50%;border:1px solid #43265a;background:#130a1b;color:#fff;font-size:21px}.empty{min-height:60vh;display:grid;place-items:center;text-align:center;color:#9d8aa9;line-height:1.55}.empty b{display:block;color:#fff;font-size:22px;margin-bottom:8px}.note{border:1px solid #392047;background:radial-gradient(circle at 90% 0%,#24102f 0%,#100817 42%,#0a060e 100%);border-radius:24px;padding:18px;margin:0 0 14px}.noteTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.noteTopic{font-size:12px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:#cba5ef}.noteSource{font-size:11px;color:#77667f;white-space:nowrap}.noteText{font-size:18px;line-height:1.5;margin:12px 0 15px}.recallLabel{font-size:10px;letter-spacing:.12em;color:#8d739d;font-weight:900;text-transform:uppercase;margin-bottom:7px}.recall{border:1px solid #4a2b5d;background:#110817;border-radius:17px;padding:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}.recallFront{font-size:15px;font-weight:850}.recallBack{font-size:14px;line-height:1.45;color:#d8cce0;margin-top:9px;display:none}.recall.flipped .recallBack{display:block}.tapHint{font-size:11px;color:#715d7d;margin-top:7px}.nbMeta{display:flex;gap:8px;margin:14px 0 20px;flex-wrap:wrap}.metaPill{border:1px solid #382047;background:#100817;border-radius:999px;padding:8px 11px;font-size:12px;color:#cbbbd4}.toast{position:fixed;left:50%;top:14%;transform:translate(-50%,-12px);opacity:0;pointer-events:none;background:#f7efff;color:#16071f;padding:10px 15px;border-radius:999px;font-weight:950;z-index:20;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><div id="toast" class="toast"></div><main id="feed"></main><aside id="notebook" aria-hidden="true"><div class="nbHead"><div class="nbTop"><div><div class="nbTitle">♥ Saved</div><div class="nbSub">Your notebook, built quietly while you scroll.</div></div><button class="closeNb" onclick="closeNotebook()" aria-label="Close notebook">×</button></div></div><div id="nbBody"></div></aside>
<script>
const C=[{"id": "piaget", "topic": "Piaget", "slide": "23", "teach": "Sensorimotor: birth–2 → object permanence. Preoperational: 2–7 → centration/egocentrism/symbolic play. Concrete operations: 7–11 → logic, reversibility, decentration. Formal operations: 11+ → abstract/deductive reasoning.", "qs": [["A 9-year-old can use simple logic and understands reversibility. Which Piaget period best fits?", "Concrete operations", ["Preoperational", "Concrete operations", "Formal operations", "Sensorimotor"]], ["Which ability closes out the sensorimotor progression in this lecture?", "Object permanence", ["Conservation", "Object permanence", "Abstract thought", "Decentration"]], ["Centration, egocentrism, pretend play, and animism belong to which period?", "Preoperational", ["Sensorimotor", "Preoperational", "Concrete operations", "Formal operations"]]]}, {"id": "cognitive", "topic": "Cognitive milestones", "slide": "25–26", "teach": "At 18 months: searching for lost objects, functional toy use, reenacting familiar activities, delayed imitation, and using one object for another in play. Concern thresholds vary: 24–30 months. Role play + crude face drawing: 36 mo; concern at 48 mo.", "qs": [["A child is not using toys in a functional way at 24 months. According to the lecture, this is:", "A developmental concern", ["Still within the expected window", "A developmental concern", "Only concerning after 36 months", "Only a language concern"]], ["Role-playing several familiar people typically appears at:", "36 months", ["18 months", "24 months", "36 months", "48 months"]], ["Planning a story and assigning roles to self and others typically appears at:", "48 months", ["24 months", "30 months", "36 months", "48 months"]]]}, {"id": "social", "topic": "Social-emotional milestones", "slide": "28–32", "teach": "3 mo: calm/recover with comforting + alert to speaker. 5 mo: positive affect to caregiver/full emotions. 9 mo: purposeful two-way interaction. 13 mo: chains of communication. 18 mo: complex emotions. 24 mo: symbolic mental representations.", "qs": [["Purposeful two-way interactions are a social-emotional goal at approximately:", "9 months", ["5 months", "9 months", "13 months", "18 months"]], ["A child typically creates mental representations usable symbolically by:", "24 months", ["9 months", "13 months", "18 months", "24 months"]], ["Shared attention typically presents at 18 months. Absence becomes concerning at:", "30 months", ["24 months", "27 months", "30 months", "36 months"]]]}, {"id": "language", "topic": "Language", "slide": "36–38", "teach": "1 yr: understands simple requests; expressive language only ~2–4 words. 5 yr: define familiar words, argue, tell stories, discuss future events, lie. Phonology=sounds; semantics=meaning; syntax=grammar; pragmatics=social use.", "qs": [["The social use of language is called:", "Pragmatics", ["Phonology", "Semantics", "Syntax", "Pragmatics"]], ["A 1-year-old in this lecture is expected to have approximately how many expressive words?", "2–4 words", ["No words", "2–4 words", "10–20 words", "50+ words"]], ["A child not using 3–4 word sentences by what age reaches the lecture's concern threshold?", "36 months", ["24 months", "30 months", "36 months", "48 months"]], ["Following a 2-step command typically presents at:", "18 months", ["12 months", "18 months", "24 months", "30 months"]]]}, {"id": "motor1", "topic": "Early motor", "slide": "40–42", "teach": "4 wk: follows object to midline. 4 mo: sits with support. 6 mo: transfers toy between hands. 9 mo: crawls/fear of falling. 12 mo: pincer grasp. 13 mo: walks alone. 18 mo: hand preference emerges.", "qs": [["Which milestone is paired with 12 months in the lecture?", "Pincer grasp", ["Sits with support", "Transfers toy between hands", "Pincer grasp", "Walks alone"]], ["Walking alone is listed at approximately:", "13 months", ["9 months", "12 months", "13 months", "18 months"]], ["Changing hands with a toy is expected at approximately:", "6 months", ["4 months", "6 months", "9 months", "12 months"]]]}, {"id": "motor2", "topic": "Preschool motor", "slide": "42–45", "teach": "Age 3: tricycle, scissors, copy circle. Age 4: self-care + copy cross/rectangle. Age 5: dress self, recognizable person, copy square. Gross: jump clear ground 24 mo; broad jump/stairs/2-sec balance 36 mo; hop one foot 42 mo.", "qs": [["A child who can ride a tricycle and copy a circle best matches age:", "3 years", ["2 years", "3 years", "4 years", "5 years"]], ["Copying a square is listed at approximately:", "5 years", ["3 years", "4 years", "5 years", "6 years"]], ["Hopping on one foot typically presents at:", "42 months", ["30 months", "36 months", "42 months", "60 months"]]]}, {"id": "screen", "topic": "Screening", "slide": "16, 19, 48", "teach": "Early childhood screening follows developmental trajectories and looks for delayed/altered cognitive, language, psychomotor, and social milestones plus chronic irritability/hyperactivity. Adolescent screening includes cognition, altered social behavior, academic performance, and psychosis. Lecture: screen for depression/anxiety after age 7.", "qs": [["According to the lecture, children should be screened for depression and anxiety after age:", "7", ["3", "5", "7", "12"]], ["Which belongs to early-childhood mental-disorder screening in this lecture?", "Developmental trajectories", ["Only school grades", "Developmental trajectories", "Only family history", "Only formal IQ testing"]], ["Persistent withdrawn symptoms plus increasing somatic symptoms in early–mid adolescence are associated with increased risk of:", "Suicidal thoughts", ["ADHD", "Suicidal thoughts", "Substance withdrawal", "Language delay"]]]}, {"id": "sdoh", "topic": "Social determinants", "slide": "3–9", "teach": "Lecture childhood social determinants: discrimination, adverse early-life experiences, poor education, poverty, housing instability/poor housing. Food insecurity is linked with psychological stress, depression/anxiety, academic/social problems, hyperactivity/inattention.", "qs": [["Which is explicitly listed as a childhood social determinant of mental health?", "Housing instability", ["Eye color", "Housing instability", "Birth order", "Handedness"]], ["Food insecurity is linked in the lecture to all EXCEPT:", "Improved attention", ["Depressive disorders", "Generalized anxiety", "Behavioral problems", "Improved attention"]], ["The home literacy environment most directly affects a child's:", "Language development", ["Language development", "Pubertal timing", "Reflexes", "Hand preference"]]]}, {"id": "adverse", "topic": "Adversity", "slide": "5, 10", "teach": "Multiple adversities carry long-term risk. Lecture: 4+ adverse early-life experiences associated with lower neurocognitive scores at age 8. Even children resilient in childhood showed elevated adult anxiety/depression risk in the cited study.", "qs": [["Exposure to 4 or more adverse early-life experiences was associated with lower neurocognitive scores at age:", "8", ["4", "6", "8", "16"]], ["Among children exposed to multiple adversities who were resilient in childhood, the lecture reports elevated adult risk of:", "Anxiety and depression", ["Only substance use disorder", "Anxiety and depression", "No later problems", "Only psychosis"]]]}, {"id": "transitional", "topic": "Transitional objects", "slide": "30", "teach": "Transitional object: has qualities reminding the child of mother; typically begins around 1 year; links to mother during separation; helps child learn someone can be out of sight but still exist.", "qs": [["Transitional objects typically begin at approximately:", "1 year", ["3 months", "6 months", "1 year", "3 years"]], ["A transitional object primarily helps bridge:", "Separation from the mothering figure", ["Language acquisition", "Separation from the mothering figure", "Toilet training", "Pubertal development"]]]}, {"id": "school", "topic": "School development", "slide": "33–34", "teach": "Kindergarten: separation, many new people, rules; delays/ADHD may first be detected. Third grade: move into concrete operations. High school: separation/individuation; psychotic illness may emerge. School phobia: real symptoms may occur; lecture emphasizes getting child back to school before pattern persists.", "qs": [["The lecture places the move into concrete operations around:", "Third grade", ["Kindergarten", "First grade", "Third grade", "High school"]], ["In school phobia, the child's physical symptoms are described as:", "Often real, not malingering", ["Always fabricated", "Often real, not malingering", "Evidence of psychosis", "Only present on weekends"]]]}, {"id": "attachment", "topic": "Attachment & loss", "slide": "47", "teach": "Children 7 months–5 years: protest → despair → detachment. Adults: protest/acute disbelief → grief/disorganization → reorganization.", "qs": [["For children 7 months–5 years, the lecture's sequence after loss is:", "Protest → despair → detachment", ["Denial → anger → bargaining", "Protest → despair → detachment", "Disbelief → reorganization → grief", "Detachment → protest → despair"]]]}, {"id": "communication", "topic": "Communicating illness", "slide": "50–51", "teach": "Explain illness clearly and honestly at the child's level; elicit fears; listen actively; don't promise 'this won't hurt' if it might; avoid euphemisms such as 'going to sleep.' Bad news: privacy, connection, avoid overload/blame, name and write illness, allow time/questions.", "qs": [["Which phrase should be avoided when explaining illness to a child?", "A euphemism such as 'going to sleep'", ["The illness's actual name", "A euphemism such as 'going to sleep'", "Clear honest answers", "Questions about fears"]], ["When giving bad news, the lecture recommends:", "Do not overwhelm the family with information", ["Give all details immediately", "Do not overwhelm the family with information", "Use the telephone when possible", "Avoid naming the illness"]]]}];
const KEY="doomstudy-human-development-v3",OLDKEY="doomstudy-human-development-v2",OLDERKEY="doomstudy-human-development-v1";
let prior=JSON.parse(localStorage.getItem(KEY)||"null")||JSON.parse(localStorage.getItem(OLDKEY)||"null")||JSON.parse(localStorage.getItem(OLDERKEY)||"null");
let S=prior||{xp:0,streak:0,best:0,seen:{},miss:{},mastery:{},seq:0,sound:true,last:null,rematch:[],saved:{}};
S.saved=S.saved||{};
let AC=null,F=document.getElementById("feed");
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),850)}
async function tone(ok){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")await AC.resume();let n=AC.currentTime+.01;function p(f,st,d,g,type="sine"){let o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(.0001,n+st);v.gain.exponentialRampToValueAtTime(g,n+st+.015);v.gain.exponentialRampToValueAtTime(.0001,n+st+d);o.connect(v);v.connect(AC.destination);o.start(n+st);o.stop(n+st+d+.03)}if(ok){p(620,0,.15,.18);p(930,.10,.22,.15)}else{p(280,0,.20,.15,"triangle");p(205,.13,.27,.12,"triangle")}}catch(e){}}
function toggleSound(ev){ev.stopPropagation();S.sound=!S.sound;save();document.querySelectorAll(".sound").forEach(b=>b.textContent=S.sound?"🔊":"🔇");if(S.sound)tone(true)}
function strength(){let a=Object.values(S.mastery);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0}
function savedCount(){return Object.keys(S.saved||{}).length}
function header(){return `<div class="top"><div class="brand">DoomStudy <span style="color:#a48caf">Human Development</span></div><div class="stats"><span class="pill">🔥 ${S.streak}</span><span class="pill">⚡ ${S.xp}</span><button class="notebookBtn" onclick="openNotebook(event)" aria-label="Open saved notebook">♥ <span class="count">${savedCount()}</span></button><button class="sound" onclick="toggleSound(event)">${S.sound?"🔊":"🔇"}</button></div></div>`}
function refreshNotebookCounts(){document.querySelectorAll(".notebookBtn .count").forEach(x=>x.textContent=savedCount())}
function openNotebook(ev){if(ev)ev.stopPropagation();renderNotebook();document.getElementById("notebook").classList.add("open");document.getElementById("notebook").setAttribute("aria-hidden","false");F.style.overflowY="hidden"}
function closeNotebook(){document.getElementById("notebook").classList.remove("open");document.getElementById("notebook").setAttribute("aria-hidden","true");F.style.overflowY="auto"}
function renderNotebook(){let body=document.getElementById("nbBody"),items=Object.values(S.saved||{}).sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));if(!items.length){body.innerHTML=`<div class="empty"><div><b>No saved Micro-Teaches yet.</b>Tap ♡ on anything worth keeping.<br>DoomStudy will build this notebook for you.</div></div>`;return}body.innerHTML=`<div class="nbMeta"><span class="metaPill">${items.length} saved concept${items.length===1?"":"s"}</span><span class="metaPill">${items.length} recall card${items.length===1?"":"s"}</span><span class="metaPill">Human Development</span></div>`+items.map((x,i)=>`<article class="note"><div class="noteTop"><div class="noteTopic">${x.topic}</div><div class="noteSource">Slide ${x.slide}</div></div><div class="noteText">${x.teach}</div><div class="recallLabel">Auto-made recall card</div><div class="recall" onclick="this.classList.toggle('flipped')"><div class="recallFront">${x.front}</div><div class="recallBack">${x.back}</div><div class="tapHint">tap to ${''}reveal / hide</div></div></article>`).join("")}
function weightedPick(){
 if(S.rematch.length && S.seq>=S.rematch[0].due){let r=S.rematch.shift(),c=C.find(x=>x.id===r.id);if(c)return c}
 let pool=[];for(let c of C){let m=S.mastery[c.id]||0,miss=S.miss[c.id]||0,w=3+(100-m)/18+miss*2+(S.seen[c.id]?0:4);if(c.id===S.last)w*=.18;for(let i=0;i<Math.max(1,Math.round(w));i++)pool.push(c)}
 return pool[Math.floor(Math.random()*pool.length)]
}
function saveTeach(ev,c,e){
 ev.stopPropagation();let on=!S.saved[c.id];
 if(on){S.saved[c.id]={topic:c.topic,teach:c.teach,slide:c.slide,front:`What should I remember about ${c.topic}?`,back:c.teach,savedAt:Date.now()};}
 else delete S.saved[c.id];
 save();refreshNotebookCounts();let b=e.querySelector(".heart");b.textContent=on?"♥":"♡";b.classList.toggle("saved",on);b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");toast(on?"♥ SAVED • NOTE + RECALL CARD READY":"REMOVED FROM SAVED");
}
function teachCard(){
 let candidates=C.filter(c=>(S.miss[c.id]||0)>0).sort((a,b)=>(S.mastery[a.id]||0)-(S.mastery[b.id]||0));
 let c=candidates[0]||C.slice().sort((a,b)=>(S.mastery[a.id]||0)-(S.mastery[b.id]||0))[0];
 let isSaved=!!S.saved[c.id];
 let e=document.createElement("section");e.className="card teach";e.innerHTML=header()+`<button class="heart ${isSaved?"saved":""}" aria-label="Save Micro-Teach">${isSaved?"♥":"♡"}</button><div><div class="kicker">⚡ MICRO-TEACH • ${c.topic}</div><div class="fact">Wait—this matters.</div><div class="chain">${c.teach}</div><div class="scroll">No answer required • keep scrolling ↑</div></div><div class="source">Lecture slide ${c.slide}</div>`;
 e.querySelector(".heart").onclick=(ev)=>saveTeach(ev,c,e);F.appendChild(e)
}
function eventCard(){
 let e=document.createElement("section");e.className="card event";e.innerHTML=header()+`<div><div class="emoji">🧠</div><h2>Brain Report</h2><p>${strength()}% concept strength<br>${S.xp} XP • best streak ${S.best}<br><br>Your weaker concepts are quietly moving up the feed.</p><div class="scroll">keep scrolling ↑</div></div>`;F.appendChild(e)
}
function add(){
 S.seq++;
 if(S.seq%10===0){eventCard();return}
 if(S.seq%6===0){teachCard();return}
 let c=weightedPick();S.last=c.id;let n=S.seen[c.id]||0,q=c.qs[n%c.qs.length];S.seen[c.id]=n+1;
 let answer=q[1],opts=[...q[2]]; // already includes correct answer
 // deterministic-ish shuffle
 opts.sort(()=>Math.random()-.5);let ai=opts.indexOf(answer);
 let e=document.createElement("section");e.className="card";e.innerHTML=header()+`<div><div class="kicker">${n>0?"↻ REMIX":"FOR YOU"} • ${c.topic}</div><div class="q">${q[0]}</div><div class="opts"></div><div class="feedback"></div></div><div class="source">Lecture slide ${c.slide}</div>`;
 let box=e.querySelector(".opts");opts.forEach((o,i)=>{let b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=()=>answerTap(e,c,q,i,ai,b,opts);box.appendChild(b)});F.appendChild(e);save()
}
function answerTap(e,c,q,i,ai,b,opts){
 if(e.dataset.done)return;e.dataset.done="1";let ok=i===ai;tone(ok);let buttons=[...e.querySelectorAll(".opt")];buttons.forEach((x,j)=>{if(j===ai)x.classList.add("good");else if(j===i)x.classList.add("bad");else x.classList.add("dim")});
 let old=S.mastery[c.id]||0;
 if(ok){S.streak++;S.best=Math.max(S.best,S.streak);let pts=12+Math.min(S.streak,8);S.xp+=pts;S.mastery[c.id]=Math.min(100,old+11);toast(`+${pts} XP • STREAK ×${S.streak}`)}
 else{S.streak=0;S.miss[c.id]=(S.miss[c.id]||0)+1;S.mastery[c.id]=Math.max(0,old-9);S.rematch.push({id:c.id,due:S.seq+4+Math.floor(Math.random()*4)});S.rematch.sort((a,b)=>a.due-b.due);toast("REMATCH PLANTED")}
 e.querySelector(".feedback").innerHTML=ok?`<b>✓ Locked in.</b> ${c.teach}`:`<b>Not quite — ${q[1]}.</b> ${c.teach}<br><span style="color:#85858f">DoomStudy will bring this concept back after some interference.</span>`;save()
}
for(let i=0;i<12;i++)add();
F.addEventListener("scroll",()=>{if(F.scrollHeight-F.scrollTop-F.clientHeight<3.2*innerHeight){for(let i=0;i<8;i++)add()}},{passive:true});
</script></body></html>
